
name: Korea Market Telegram Digest

on:
  schedule:
    - cron: "0 13 * * *" # 22:00 KST

  workflow_dispatch:
    inputs:
      digest_date:
        description: "Digest date YYYY-MM-DD (blank = today KST)"
        required: false
        default: ""
        type: string

      dry_run:
        description: "Preview only (do not send to Telegram)"
        required: false
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: korea-market-telegram-digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: "gemini-2.5-flash"
      TELEGRAM_CHAT_ID: "-1004343274047"
      STRICT_AI: "1"
      TZ: Asia/Seoul

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check required secrets
        run: |
          python - <<'PY'
          import os

          for name in (
              "TELEGRAM_BOT_TOKEN",
              "GEMINI_API_KEY",
              "TELEGRAM_CHAT_ID"
          ):
              if not os.getenv(name, "").strip():
                  raise SystemExit(f"Missing {name}")

          print("Configuration OK")
          PY

      - name: Validate Python syntax
        run: python -m py_compile bot.py

      - name: Run AI-powered Korea news digest
        env:
          DIGEST_DATE: ${{ inputs.digest_date }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '1' || '0' }}
        run: python bot.py
