name: Korea Market Telegram Digest

on:
  schedule:
    - cron: '0 13 * * *' # 22:00 Asia/Seoul (UTC+9)
  workflow_dispatch:
    inputs:
      digest_date:
        description: 'KST date YYYY-MM-DD (blank = today)'
        required: false
        type: string
      dry_run:
        description: 'Preview without posting to Telegram'
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: korea-market-telegram-digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: '-1004343274047'
      DIGEST_DATE: ${{ inputs.digest_date || '' }}
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '1' || '0' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run free RSS digest
        run: python bot.py
